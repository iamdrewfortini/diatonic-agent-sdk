[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "diatonic-meta-pipeline"
version = "0.3.5"
description = "Provider-neutral Bifrost agents, estate evidence and bounded verified execution"
requires-python = ">=3.11"
dependencies = ["openai>=3.40,<4", "pydantic>=2.12,<3", "httpx>=0.28,<1", "PyYAML>=6,<7",
    "openai-agents>=0.24,<0.25", "fastapi>=0.135,<1", "uvicorn>=0.34,<1", "sse-starlette>=3,<4",
    "temporalio==1.34.0", "jsonschema>=4.26,<5", "onepassword-sdk==0.4.2", "cryptography==50.0.2"]

[tool.setuptools.package-data]
meta_pipeline = ["data/*.json"]

[project.scripts]
meta-pipeline = "meta_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["private_reference: requires a separately held private reference bundle"]

